<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>知っている英語を、会話の音につなげる。｜坪田まゆみ</title>
  <link rel="stylesheet" href="/static-pages/tsubota-21day-funnel-materials/pages/sales.css?v=20261025b">
  <link rel="stylesheet" href="/static-pages/tsubota-21day-funnel-materials/pages/webinar.css?v=20261025b">
</head>
<body class="webinar-page" data-route="webinar">
  <div class="sales-top" aria-hidden="true"></div>
  <main>
    <section class="webinar-intro">
      <div class="sales-narrow">
        <p class="sales-kicker">魔法の10ミニッツ発音メソッド</p>
        <h1>知っている英語を、会話の音につなげる。</h1>
        <div class="webinar-lead"><p>魔法の10ミニッツ発音メソッド・無料オンラインセミナーへようこそ。</p></div>
      </div>
    </section>
    <section class="webinar-viewing" aria-label="オンラインセミナー">
      <div class="webinar-wide">
        <div class="webinar-video-frame">
          <div class="webinar-video-art"><img src="/static-pages/tsubota-21day-funnel-materials/pages/assets/tsubota.png" alt="坪田まゆみ"></div>
          <div class="webinar-video-title"><span>無料オンラインセミナー</span><strong>魔法の10ミニッツ<br>発音メソッド</strong><small>坪田まゆみ</small></div>
        </div>
        <p class="webinar-prep">声を出せる環境と、メモできるものをご用意ください。</p>
      </div>
    </section>
    <div class="webinar-letter-head"><div class="sales-narrow"><p>セミナーでご案内する<br><strong>21日間チャレンジコース</strong></p></div></div>
    <iframe class="webinar-sales-frame" title="21日間チャレンジコースの販売ページ" src="/static-pages/tsubota-21day-funnel-materials/pages/sales/" loading="lazy" scrolling="no"></iframe>
  </main>
  <footer class="sales-footer">© 坪田まゆみ</footer>
  <script>
    (() => {
      const frame = document.querySelector('.webinar-sales-frame');
      if (!frame) return;
      const resize = () => {
        try {
          const doc = frame.contentDocument;
          if (!doc) return;
          frame.style.height = Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight) + 'px';
        } catch (_) { /* 同一公開元の販売ページのみ表示する */ }
      };
      frame.addEventListener('load', () => {
        resize();
        const doc = frame.contentDocument;
        if (doc && window.ResizeObserver) new ResizeObserver(resize).observe(doc.documentElement);
      });
      window.addEventListener('resize', resize);
    })();
  </script>
</body>
</html>
