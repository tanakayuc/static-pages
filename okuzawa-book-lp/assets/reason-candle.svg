<svg xmlns="http://www.w3.org/2000/svg" width="96mm" height="100mm" viewBox="0 0 960 1000" role="img" aria-labelledby="figure42-title figure42-desc">
<title id="figure42-title">日中の値動きの波を一本のローソク足にまとめる</title>
<desc id="figure42-desc">左は日中に上下しながら始値より終値が高くなる陽線、右は日中に上下しながら始値より終値が低くなる陰線。曲線の始まりと終わり、高値と安値を一本のローソク足に要約する架空の模式図。</desc>
<rect width="960" height="1000" fill="#fff"/>
<g font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif">
<text x="58" y="63" fill="#25292c" font-size="40" font-weight="700">日中の波を、1本のローソク足にまとめる</text>
<text x="58" y="110" fill="#53616a" font-size="29">途中は上下しても、最初と最後の価格で陽線・陰線が決まる</text>
<rect x="58" y="154" width="408" height="640" rx="12" fill="#f8faf9" stroke="#d7e1e3" stroke-width="2"/>
<rect x="494" y="154" width="408" height="640" rx="12" fill="#f8faf9" stroke="#d7e1e3" stroke-width="2"/>
<text x="88" y="212" fill="#245d77" font-size="37" font-weight="700">陽線｜最後は上</text>
<text x="524" y="212" fill="#30373b" font-size="37" font-weight="700">陰線｜最後は下</text>
<text x="88" y="265" fill="#50626b" font-size="30">日中の動き</text>
<text x="336" y="265" fill="#50626b" font-size="30">1本</text>
<text x="524" y="265" fill="#50626b" font-size="30">日中の動き</text>
<text x="772" y="265" fill="#50626b" font-size="30">1本</text>
