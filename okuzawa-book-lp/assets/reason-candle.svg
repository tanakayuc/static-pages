<text x="396" y="335" fill="#344750" font-size="29">高値</text>
<text x="396" y="390" fill="#344750" font-size="29">終値</text>
<text x="396" y="506" fill="#344750" font-size="29">始値</text>
<text x="396" y="561" fill="#344750" font-size="29">安値</text>
