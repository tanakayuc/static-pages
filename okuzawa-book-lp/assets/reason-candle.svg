<text x="88" y="680" fill="#25292c" font-size="30" font-weight="700">途中で下がっても、</text>
<text x="88" y="725" fill="#25292c" font-size="30" font-weight="700">最後は最初より高い。</text>
<text x="524" y="680" fill="#25292c" font-size="30" font-weight="700">途中で上がっても、</text>
<text x="524" y="725" fill="#25292c" font-size="30" font-weight="700">最後は最初より低い。</text>
<text x="58" y="858" fill="#344750" font-size="31">線の一番上が高値、一番下が安値。</text>
<text x="58" y="908" fill="#344750" font-size="31">太い部分の上下が始値と終値です。</text>
<text x="58" y="963" fill="#65737b" font-size="32">架空の模式図。日足なら1本が1取引日。</text>
</g>
</svg>
