<svg xmlns="http://www.w3.org/2000/svg" width="96mm" height="116mm" viewBox="0 0 960 1160" role="img" aria-labelledby="title desc">
<title id="title">日足の上向きの流れで下げを待つ考え方</title>
<desc id="desc">日足の20MAが上向きの場面で、一時的な下げとその後の向き直りを観察する概念図。③で実線を止め、将来の動きは描かない。</desc>
<rect width="960" height="1160" fill="#fff"/>
<g font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif">
<text x="60" y="60" fill="#5c656b" font-size="29">図4-7｜上向きの流れで待つ考え方</text>
<text x="60" y="122" fill="#25292c" font-size="42" font-weight="700">下げたら買う、ではない</text>
<line x1="60" y1="145" x2="900" y2="145" stroke="#aeb7bc" stroke-width="2"/>
<rect x="60" y="184" width="840" height="370" fill="#f8fafb" stroke="#d5dfe3" stroke-width="2"/>
<text x="90" y="230" fill="#5c656b" font-size="28">実線＝価格の動き　破線＝20MAの向きの目安</text>
<polyline points="105,540 600,459" fill="none" stroke="#275369" stroke-width="5" stroke-dasharray="14 10" stroke-linecap="round"/>
<polyline points="105,453 205,388 310,337 440,421 535,454 600,410" fill="none" stroke="#25292c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="310" cy="506" r="22" fill="#fff" stroke="#275369" stroke-width="3"/><text x="310" y="517" text-anchor="middle" fill="#275369" font-size="30" font-weight="700">1</text>
<circle cx="490" cy="438" r="22" fill="#fff" stroke="#275369" stroke-width="3"/><text x="490" y="449" text-anchor="middle" fill="#275369" font-size="30" font-weight="700">2</text>
<text x="640" y="520" fill="#5c656b" font-size="31">この先は未確定</text>
<circle cx="600" cy="410" r="22" fill="#fff" stroke="#275369" stroke-width="3"/><text x="600" y="421" text-anchor="middle" fill="#275369" font-size="30" font-weight="700">3</text>
<rect x="60" y="589" width="840" height="96" fill="#fff" stroke="#d5dfe3" stroke-width="2"/>
<text x="90" y="630" fill="#275369" font-size="31" font-weight="700">① 日足の20MAの上向きを見る</text>
<text x="90" y="666" fill="#25292c" font-size="27">その場の上げだけで、すぐには買わない。</text>
<rect x="60" y="704" width="840" height="96" fill="#fff" stroke="#d5dfe3" stroke-width="2"/>
<text x="90" y="745" fill="#275369" font-size="31" font-weight="700">② 一時的な下げを待つ</text>
<text x="90" y="781" fill="#25292c" font-size="27">下げが止まる前に買いを急がない。</text>
<rect x="60" y="819" width="840" height="96" fill="#fff" stroke="#d5dfe3" stroke-width="2"/>
<text x="90" y="860" fill="#275369" font-size="31" font-weight="700">③ 再び上を向くか確かめる</text>
<text x="90" y="896" fill="#25292c" font-size="27">反発の初期を観察。まだ買う合図ではない。</text>
<rect x="60" y="953" width="405" height="115" fill="#f1f5f6" stroke="#d5dfe3" stroke-width="2"/>
<text x="82" y="1002" fill="#275369" font-size="29" font-weight="700">読めない → 見送り</text>
<text x="82" y="1040" fill="#25292c" font-size="28">理由を作って注文しない</text>
<rect x="485" y="953" width="415" height="115" fill="#f1f5f6" stroke="#d5dfe3" stroke-width="2"/>
<text x="507" y="1002" fill="#275369" font-size="29" font-weight="700">候補 → 損失条件を確認</text>
<text x="507" y="1040" fill="#25292c" font-size="28">形だけで注文しない</text>
<text x="60" y="1120" fill="#5c656b" font-size="27">架空の模式図。将来の反発や利益を示すものではありません。</text>
</g>
</svg>
