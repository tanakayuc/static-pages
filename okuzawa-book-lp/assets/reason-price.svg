<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" role="img" aria-labelledby="title"><title id="title">書籍代0円（実質無料）、ご負担は送料税込550円のみ</title><rect width="680" height="390" rx="18" fill="#f7f2e7"/><text x="340" y="66" text-anchor="middle" font-size="27" fill="#1d283e" font-family="sans-serif">今回のお届け条件</text><rect x="40" y="100" width="280" height="190" rx="14" fill="#fff" stroke="#d9cdb4" stroke-width="3"/><text x="180" y="152" text-anchor="middle" font-size="24" fill="#4f5b6c" font-family="sans-serif">書籍代</text><text x="180" y="232" text-anchor="middle" font-size="64" font-weight="bold" fill="#1d283e" font-family="sans-serif">0円</text><text x="180" y="270" text-anchor="middle" font-size="20" fill="#4f5b6c" font-family="sans-serif">実質無料</text><text x="340" y="206" text-anchor="middle" font-size="44" font-weight="bold" fill="#b8452a" font-family="sans-serif">＋</text><rect x="360" y="100" width="280" height="190" rx="14" fill="#1d283e"/><text x="500" y="152" text-anchor="middle" font-size="24" fill="#e2cb9e" font-family="sans-serif">送料のみ（税込）</text><text x="500" y="232" text-anchor="middle" font-size="64" font-weight="bold" fill="#fff" font-family="sans-serif">550円</text><text x="500" y="270" text-anchor="middle" font-size="20" fill="#e2cb9e" font-family="sans-serif">クレジットカード払い</text><text x="340" y="342" text-anchor="middle" font-size="22" fill="#4f5b6c" font-family="sans-serif">お支払いは送料の税込550円だけです</text></svg>