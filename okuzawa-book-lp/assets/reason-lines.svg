<svg xmlns="http://www.w3.org/2000/svg" width="96mm" height="74mm" viewBox="0 0 960 740" xml:lang="ja" role="img" aria-labelledby="title desc">
<title id="title">図4-6 短い期間と少し長い期間の線</title><desc id="desc">模式図。20MAはゆっくり変わる少し長い期間の向きを、5MAは直近の値動きへの早い反応を示す。</desc>
<rect width="960" height="740" fill="#fff"/>
<text x="52" y="52" fill="#5c656b" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="28">図4-6｜短い期間と少し長い期間の線</text>
<text x="52" y="111" fill="#25292c" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="40" font-weight="700">足元の動きと少し長い流れを比べる</text>
<line x1="52" y1="139" x2="908" y2="139" stroke="#aeb7bc" stroke-width="2"/>
<path d="M82 243 L103 235 L125 240 L146 257 L167 278 L188 291 L210 289 L231 277 L252 265 L273 264 L295 278 L316 299 L337 316 L359 320 L380 311 L401 297 L422 291 L444 300 L465 319 L486 339 L508 348 L529 344 L550 331 L571 321 L593 323 L614 339 L635 360 L656 375 L678 376 L699 379" fill="none" stroke="#7b8488" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M82 251 L103 251 L125 247 L146 246 L167 251 L188 260 L210 271 L231 278 L252 280 L273 277 L295 275 L316 277 L337 284 L359 295 L380 305 L401 308 L422 307 L444 304 L465 304 L486 309 L508 319 L529 330 L550 336 L571 336 L593 333 L614 331 L635 335 L656 344 L678 355 L699 366" fill="none" stroke="#c47743" stroke-width="6" stroke-dasharray="14 12" stroke-linecap="butt"/>
<path d="M82 216 L103 219 L125 221 L146 224 L167 227 L188 233 L210 238 L231 243 L252 246 L273 249 L295 251 L316 254 L337 259 L359 264 L380 270 L401 274 L422 276 L444 278 L465 281 L486 285 L508 291 L529 296 L550 301 L571 304 L593 306 L614 308 L635 312 L656 317 L678 322 L699 328" fill="none" stroke="#24536a" stroke-width="8" stroke-linecap="round"/>
<text x="718" y="370" fill="#c47743" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="28" font-weight="700">5MA</text>
<text x="718" y="334" fill="#24536a" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="28" font-weight="700">20MA</text>
<text x="718" y="409" fill="#6d777c" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="28">価格</text>
<text x="52" y="463" fill="#5c656b" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="28">太線＝20MA　破線＝5MA　灰の折れ線＝価格</text>
<line x1="52" y1="486" x2="908" y2="486" stroke="#aeb7bc" stroke-width="2"/>
<text x="60" y="540" fill="#24536a" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="28" font-weight="700">少し長い期間（20MA）</text><text x="445" y="540" fill="#25292c" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="28">ゆっくり動く、少し長い流れの目安</text>
<text x="60" y="593" fill="#c47743" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="28" font-weight="700">短い期間（5MA）</text><text x="445" y="593" fill="#25292c" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="28">直近の動きに、早く反応する</text>
<text x="52" y="640" fill="#5c656b" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="28">MA＝移動平均線。5・20は計算に使う直近の本数。</text>
<text x="52" y="685" fill="#5c656b" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="28">模式図。2本の向きだけで注文を決めるものではありません。</text>
</svg>
