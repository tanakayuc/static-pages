<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title"><title id="title">これまでの判断の流れと、本書の判断の流れの比較</title><rect width="900" height="330" rx="18" fill="#f6f4ee"/><rect x="25" y="25" width="385" height="280" rx="16" fill="#fff" stroke="#c4c3bd" stroke-width="3"/><rect x="490" y="25" width="385" height="280" rx="16" fill="#eaf0f7" stroke="#2f4b7c" stroke-width="3"/><text x="218" y="72" text-anchor="middle" font-size="26" font-weight="bold" fill="#686660" font-family="sans-serif">これまで</text><text x="682" y="72" text-anchor="middle" font-size="26" font-weight="bold" fill="#1d3561" font-family="sans-serif">本書の視点</text><path d="M428 165h45m-16-16 16 16-16 16" stroke="#b8452a" stroke-width="7" fill="none"/><text x="218" y="125" text-anchor="middle" font-size="21" fill="#3a3a3a" font-family="sans-serif">1. 値動きや人の報告を見る</text><text x="682" y="125" text-anchor="middle" font-size="21" fill="#1d283e" font-family="sans-serif">1. 見た事実と気持ちを分ける</text><text x="218" y="158" text-anchor="middle" font-size="16" fill="#9a9890" font-family="sans-serif">↓</text><text x="682" y="158" text-anchor="middle" font-size="16" fill="#2f4b7c" font-family="sans-serif">↓</text><text x="218" y="187" text-anchor="middle" font-size="21" fill="#3a3a3a" font-family="sans-serif">2. 焦りや怖さで予定を変える</text><text x="682" y="187" text-anchor="middle" font-size="20" fill="#1d283e" font-family="sans-serif">2. チャートと事前条件を確認する</text><text x="218" y="220" text-anchor="middle" font-size="16" fill="#9a9890" font-family="sans-serif">↓</text><text x="682" y="220" text-anchor="middle" font-size="16" fill="#2f4b7c" font-family="sans-serif">↓</text><text x="218" y="249" text-anchor="middle" font-size="20" fill="#3a3a3a" font-family="sans-serif">3. 振り返れず同じ失敗を繰り返す</text><text x="682" y="249" text-anchor="middle" font-size="20" fill="#1d283e" font-family="sans-serif">3. 理由を言葉にして記録・見直す</text></svg>