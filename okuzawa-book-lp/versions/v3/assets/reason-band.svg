<svg xmlns="http://www.w3.org/2000/svg" width="96mm" height="96mm" viewBox="0 0 960 960" role="img" aria-labelledby="title desc">
<title id="title">図4-4 20MAとボリンジャーバンドの役割</title><desc id="desc">中央の20MAは少し長めの向き、上下の帯は価格の広がりを見る。帯は売買の合図や価格の上限下限ではない。</desc>
<rect width="960" height="960" fill="#fff"/>
<text x="52" y="52" fill="#5c656b" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="28">図4-4｜線と帯の役割</text>
<text x="52" y="111" fill="#25292c" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="40" font-weight="700">まず見るのは、線の向きと帯の幅</text>
<line x1="52" y1="138" x2="908" y2="138" stroke="#aeb7bc" stroke-width="2"/>
<path d="M100 327 C250 308 370 258 690 190 L690 416 C410 415 255 441 100 447 Z" fill="#edf4f7"/>
<path d="M100 327 C250 308 370 258 690 190" fill="none" stroke="#7ea7bb" stroke-width="5"/>
<path d="M100 447 C255 441 410 415 690 416" fill="none" stroke="#7ea7bb" stroke-width="5"/>
<path d="M100 386 C245 376 380 339 690 304" fill="none" stroke="#24536a" stroke-width="8"/>
<path d="M110 408 L180 375 L235 391 L290 335 L345 363 L408 311 L466 328 L528 262 L592 287 L653 231 L690 243" fill="none" stroke="#262a2d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="708" y="195" fill="#24536a" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="27">帯の上端</text>
<text x="708" y="311" fill="#24536a" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="27" font-weight="700">20MA</text>
<text x="708" y="420" fill="#24536a" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="27">帯の下端</text>
<text x="708" y="247" fill="#262a2d" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="29">価格</text>
<line x1="52" y1="490" x2="908" y2="490" stroke="#aeb7bc" stroke-width="2"/>
<text x="52" y="535" fill="#25292c" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="29" font-weight="700">20MAの向きは、左から右への進み方で比べる</text>
<rect x="52" y="560" width="270" height="185" rx="10" fill="#f7fafb" stroke="#d3dfe4" stroke-width="2"/>
<rect x="345" y="560" width="270" height="185" rx="10" fill="#f7fafb" stroke="#d3dfe4" stroke-width="2"/>
<rect x="638" y="560" width="270" height="185" rx="10" fill="#f7fafb" stroke="#d3dfe4" stroke-width="2"/>
<path d="M85 675 C145 666 195 629 285 601" fill="none" stroke="#24536a" stroke-width="8" stroke-linecap="round"/>
<path d="M378 635 C450 633 535 638 578 635" fill="none" stroke="#24536a" stroke-width="8" stroke-linecap="round"/>
<path d="M672 597 C738 619 810 662 875 675" fill="none" stroke="#24536a" stroke-width="8" stroke-linecap="round"/>
<text x="187" y="723" fill="#24536a" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="28" font-weight="700" text-anchor="middle">上向き</text>
<text x="480" y="723" fill="#24536a" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="28" font-weight="700" text-anchor="middle">横ばい</text>
<text x="773" y="723" fill="#24536a" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="28" font-weight="700" text-anchor="middle">下向き</text>

<text x="60" y="805" fill="#24536a" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="29" font-weight="700">20MAの傾き</text><text x="292" y="805" fill="#25292c" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="29">→ 少し長めの向き</text>
<text x="60" y="857" fill="#24536a" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="29" font-weight="700">上下の帯の幅</text><text x="292" y="857" fill="#25292c" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="29">→ 値動きの広がりの目安</text>
<text x="52" y="930" fill="#5c656b" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="29">帯は価格の上限・下限ではなく、売買の合図でもありません。</text>
</svg>
