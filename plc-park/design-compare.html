<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLC デザイン比較</title><style>*{box-sizing:border-box}body{height:100dvh;display:flex;flex-direction:column;margin:0;color:#202622;background:#e9ece9;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}header{flex-shrink:0;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;background:white;border-bottom:1px solid #d9dfd9}h1{font-size:17px;margin:0 auto 0 0}a{color:#24574b;font-size:14px}button,select{font:inherit;font-size:14px;border:1px solid #c7d1c9;background:white;border-radius:9px;padding:10px 13px;min-height:44px;color:inherit}button{cursor:pointer}button[aria-pressed=true]{background:#24574b;color:white;border-color:#24574b}label{font-size:13px}#stage{flex:1;min-height:0;padding:0;display:flex;justify-content:center}iframe{border:0;width:100%;height:100%;background:white}#stage.mobile iframe{max-width:390px}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #156bc1;outline-offset:3px}@media(max-width:650px){header{gap:8px;padding:10px 12px}h1{flex-basis:60%}button,select{font-size:12px;padding:9px}label{font-size:12px}}</style><header><h1>PLC デザイン比較</h1><a href="design-review.html">分析・設計を見る</a><div role="group" aria-label="比較するデザイン"><button data-version="before" aria-pressed="false">変更前</button> <button data-version="after" aria-pressed="true">改善版</button></div><label>書体 <select id="font"><option value="native">端末標準＋ヒラギノ</option><option value="noto">Noto Sans JP（無料）</option></select></label><button id="mobile" aria-pressed="false">スマホ幅</button><a id="open" href="portal-demo.html#home" target="_blank" rel="noopener">単独で開く ↗</a></header><div id="stage"><iframe id="preview" title="PLCポータルのデザイン比較" src="portal-demo.html?v=12#home"></iframe></div><script>const frame=document.querySelector('#preview'),font=document.querySelector('#font');let version='after',scroll=0;function load(){let hash='#home';try{hash=frame.contentWindow.location.hash||hash;scroll=frame.contentWindow.scrollY}catch{}const url=(version==='before'?'portal-baseline-v11.html':'portal-demo.html')+'?v=12&font='+font.value+hash;frame.src=url;document.querySelector('#open').href=url;font.disabled=version==='before';document.querySelectorAll('[data-version]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.version===version))}frame.addEventListener('load',()=>{frame.contentWindow.scrollTo(0,scroll)});document.querySelectorAll('[data-version]').forEach(b=>b.onclick=()=>{version=b.dataset.version;load()});font.onchange=load;document.querySelector('#mobile').onclick=e=>{const m=document.querySelector('#stage').classList.toggle('mobile');e.currentTarget.setAttribute('aria-pressed',m)};</script></html>
