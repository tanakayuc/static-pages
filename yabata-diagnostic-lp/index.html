<!DOCTYPE html>
<html lang="ja">
<head>
<script>if(new URLSearchParams(location.search).get("embed"))document.documentElement.classList.add("embed")</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>カウンセラー起業タイプ診断（組み込み前の見本）｜安心安定のカウンセラー起業</title>
<style>
:root{
  --teal:#FF4E9E; --teal-deep:#C2185B; --teal-tint:#FFF1F7; --ink:#3A1C2C; --muted:#77606C;
  --btn:#C2185B; --line:#F5D9E6; --shadow:0 10px 30px rgba(120,20,70,.09);
  --marker:linear-gradient(transparent 58%, #FFE97F 58%, #FFE97F 92%, transparent 92%);
  --gothic:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --latin:"Avenir Next","Futura","Verdana",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--gothic);color:var(--ink);background:#fff;line-height:1.9;font-size:16px;overflow-wrap:anywhere}
img{max-width:100%}
a{color:var(--teal-deep)}
.proto{background:#2E1622;color:#fff;font-size:13px;text-align:center;padding:6px 12px}
header.site{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line)}
header.site .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:10px 20px;gap:12px}
.brand{font-weight:700;font-size:15px;color:var(--ink);text-decoration:none;white-space:nowrap}
.brand small{display:block;font-family:var(--latin);font-size:11px;letter-spacing:.12em;color:var(--teal-deep)}
nav.gnav{display:flex;gap:18px;font-size:13px}
nav.gnav a{color:var(--ink);text-decoration:none}
nav.gnav a:hover{color:var(--teal-deep)}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
section{padding:72px 0;border-bottom:1px solid var(--line)}
section.tint{background:var(--teal-tint)}
.eyebrow{font-family:var(--latin);letter-spacing:.16em;font-size:12px;color:var(--teal-deep);margin:0 0 8px;font-weight:700}
h1{font-size:clamp(26px,4.6vw,40px);line-height:1.45;margin:0 0 18px}
h2{font-size:clamp(22px,3.4vw,30px);line-height:1.5;margin:0 0 20px}
h3{font-size:20px;line-height:1.5;margin:0 0 10px}
.mk{background:var(--marker)}
.lead{font-size:17px;color:var(--muted)}
.btn{display:inline-block;background:var(--btn);color:#fff;text-decoration:none;font-weight:700;border:0;border-radius:999px;padding:16px 34px;font-size:17px;cursor:pointer;box-shadow:var(--shadow);font-family:var(--gothic)}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:#fff;color:var(--btn);border:2px solid var(--btn);box-shadow:none}
.center{text-align:center}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 26px;font-size:14px}
.meta span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 14px}
.hero{padding:64px 0 56px;background:linear-gradient(180deg,var(--teal-tint),#fff)}
.hero .tool{font-weight:700;color:var(--teal-deep);margin:0 0 6px}
/* 診断 */
#quiz{scroll-margin-top:70px}
#quizCard{scroll-margin-top:80px}
.quiz-card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:28px 24px;min-height:380px}
.progress{height:8px;background:var(--teal-tint);border-radius:99px;overflow:hidden;margin:0 0 6px}
.progress i{display:block;height:100%;width:0;background:var(--teal);transition:width .3s}
.pcount{font-size:13px;color:var(--muted);margin:0 0 16px;font-family:var(--latin)}
.qtext{font-size:20px;font-weight:700;margin:0 0 20px;line-height:1.6}
.opts{display:grid;gap:12px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 18px;font-size:16px;color:var(--ink);cursor:pointer;font-family:var(--gothic);line-height:1.6}
.opt:hover,.opt:focus{border-color:var(--teal);background:var(--teal-tint);outline:none}
.opts.yn{grid-template-columns:1fr 1fr}
.opts.yn .opt{text-align:center;font-weight:700}
.back{background:none;border:0;color:var(--muted);font-size:14px;margin-top:16px;cursor:pointer;text-decoration:underline;font-family:var(--gothic)}
.calc{text-align:center;padding:60px 0}
.dots i{display:inline-block;width:10px;height:10px;margin:0 4px;border-radius:50%;background:var(--teal);animation:b 1s infinite alternate}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes b{from{opacity:.25}to{opacity:1}}
.result-name{font-size:24px;font-weight:700;margin:6px 0 10px;line-height:1.5}
.form{background:var(--teal-tint);border-radius:16px;padding:20px;margin-top:20px}
.form label{display:block;font-size:14px;font-weight:700;margin:0 0 6px}
.form input{width:100%;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
.note{font-size:13px;color:var(--muted);line-height:1.7}
.sample{border:2px dashed var(--teal);border-radius:16px;padding:20px;margin-top:22px}
.sample h4{margin:0 0 8px;font-size:15px;color:var(--teal-deep)}
/* 本文 */
.check{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.check li{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px 12px 44px;position:relative}
.check li::before{content:"✓";position:absolute;left:16px;top:11px;color:var(--teal-deep);font-weight:700}
.types{display:grid;gap:22px}
.type{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px 24px;box-shadow:var(--shadow)}
.type-no{font-family:var(--latin);font-weight:700;color:var(--teal-deep);letter-spacing:.12em;margin:0;font-size:13px}
.type-lead{font-weight:700}
.mini-voice{border-left:4px solid var(--teal);padding:4px 0 4px 14px;margin:12px 0 0;font-size:15px}
.mini-voice span{display:block;font-size:13px;color:var(--muted)}
.voices{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.voice{margin:0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}
.voice .tag{display:inline-block;font-size:12px;background:var(--teal-tint);color:var(--teal-deep);border-radius:99px;padding:2px 10px;margin-bottom:8px}
.voice blockquote{margin:0 0 10px;font-size:15px;line-height:1.8}
.voice figcaption{font-size:13px;color:var(--muted)}
.profile{display:grid;grid-template-columns:180px 1fr;gap:28px;align-items:start}
.photo{aspect-ratio:1;border-radius:50%;background:var(--teal-tint);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);text-align:center;padding:16px}
.books{display:grid;gap:8px;margin:14px 0 0;padding:0;list-style:none;font-size:15px}
.books li::before{content:"📘 "}
.faq details{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:12px}
.faq summary{font-weight:700;cursor:pointer}
.challenge{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0}
.challenge div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center}
.challenge b{display:block;font-family:var(--latin);color:var(--teal-deep);letter-spacing:.1em}
.steps{display:flex;gap:6px;list-style:none;padding:0;margin:0 0 14px;font-size:13px}
.steps li{flex:1;text-align:center;padding:6px 4px;border-radius:8px;background:#f3eef1;color:var(--muted)}
.steps li.done{background:var(--teal-tint);color:var(--teal-deep);font-weight:700}
.steps li.now{background:var(--teal-deep);color:#fff;font-weight:700}
.warn{background:#FFF8E1;border:1px solid #FFE08A;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:700}
.btn.line{background:#06C755}
.bridge{margin:28px 0 12px;text-align:center;font-weight:700;color:var(--teal-deep);font-size:17px}
.bridge::before,.bridge::after{content:"";display:block;width:2px;height:18px;background:var(--teal);margin:6px auto}
.lpblock{border:1px solid var(--teal-tint);border-radius:16px;padding:0 0 18px;overflow:hidden;background:#fff}
.lpblock>*:not(.lphero){margin-left:18px;margin-right:18px}
.lphero{display:block;width:100%;height:auto}
.lph{font-size:19px;margin:16px 18px 6px}
.lph2{font-size:22px;line-height:1.5;margin:4px 18px 10px}
.lpcatch{font-weight:700;color:#d82f81;margin-top:0}
.lpcheck{padding-left:22px}
.lpcheck li{margin:6px 0}
.greet{margin-top:18px}
.profile{margin-top:18px;background:#faf7f9;border-radius:12px;padding:14px 16px;font-size:14px}
.ocimg{display:block;width:100%;height:auto;margin-top:14px;border-radius:12px}

.video-slot{aspect-ratio:16/9;background:#e9f1ef;border:2px dashed #9bc3bb;border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;color:var(--muted);font-size:14px}
.flow{counter-reset:f;list-style:none;padding:0;margin:0 0 10px;display:grid;gap:12px}
.flow li{counter-increment:f;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px 14px 60px;position:relative}
.flow li::before{content:counter(f);position:absolute;left:16px;top:14px;width:30px;height:30px;border-radius:50%;background:var(--teal-deep);color:#fff;font-weight:700;text-align:center;line-height:30px;font-family:var(--latin)}
.flow b{display:block}
footer{padding:36px 20px;text-align:center;font-size:13px;color:var(--muted)}
footer a{color:var(--muted);margin:0 8px}
@media (max-width:760px){
  nav.gnav{display:none}
  section{padding:52px 0}
  .profile{grid-template-columns:1fr}
  .photo{max-width:160px;margin:0 auto}
  .challenge{grid-template-columns:1fr}
  .quiz-card{padding:22px 16px}
  .btn{width:100%;text-align:center;padding:16px 20px}
}
.profile-photo{width:100%;height:auto;border-radius:14px;display:block}
.rh{font-size:19px;margin:30px 0 10px;padding-left:12px;border-left:4px solid #B02B5C}
.bars{display:grid;gap:8px;margin:6px 0 0}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:10px;align-items:center;font-size:14px}
.bt{height:12px;border-radius:6px;background:#f1e4ea;overflow:hidden;display:block}
.bt i{display:block;height:100%;background:#B02B5C;border-radius:6px}
.scenes,.gets{padding-left:0;list-style:none;display:grid;gap:8px;margin:0}
.scenes li,.gets li{background:#faf7f9;border-radius:10px;padding:10px 14px 10px 36px;position:relative}
.scenes li::before{content:"\201C";position:absolute;left:12px;top:6px;color:#B02B5C;font-size:22px}
.gets li::before{content:"✓";position:absolute;left:13px;top:10px;color:#B02B5C;font-weight:700}
.steps3{padding-left:0;list-style:none;counter-reset:s;display:grid;gap:10px;margin:0}
.steps3 li{counter-increment:s;background:#fff;border:1px solid #eadde3;border-radius:12px;padding:12px 14px 12px 52px;position:relative}
.steps3 li::before{content:counter(s);position:absolute;left:14px;top:12px;width:28px;height:28px;border-radius:50%;background:#B02B5C;color:#fff;text-align:center;line-height:28px;font-weight:700}
.steps3 b{display:block;margin-bottom:2px}
details{border-bottom:1px solid #eadde3;padding:10px 0}details summary{cursor:pointer;font-weight:700}
.bridgebox{background:#fdf2f6;border-radius:12px;padding:14px 16px;font-weight:700;margin-top:26px}
.env{text-align:center;margin:6px 0 4px}
.env span{display:inline-block;font-size:72px;line-height:1;animation:floaty 3s ease-in-out infinite;filter:drop-shadow(0 8px 10px rgba(176,43,92,.25))}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
.letter{background:#fffdf7;border:1px solid #eadfcc;border-radius:8px;padding:22px 20px;margin-top:14px;box-shadow:0 10px 28px rgba(60,30,40,.10);animation:unfold .9s ease both}
@keyframes unfold{from{opacity:0;transform:translateY(28px) scale(.96)}to{opacity:1;transform:none}}
.lt-to{font-size:20px;font-weight:700;margin:0 0 8px}
.lt-open{margin:0 0 6px}
.lt-from{display:flex;gap:14px;align-items:center;margin:26px 0 4px;padding-top:16px;border-top:1px dashed #d9c9b0}
.lt-from img{width:56px;height:auto;border-radius:50%;object-fit:cover;aspect-ratio:1;object-position:top}
.lt-from span{line-height:1.7}
@media (prefers-reduced-motion:reduce){.env span,.letter{animation:none}}


/* ---- 統一デザイン：バラ色 × クリーム × 金のアクセント（LPと同じ） ---- */
:root{--cream:#FFF9F1;--gold:#B8925A;--rose:#C2185B;--rose-soft:#FFEAF2}
.script{font-family:'Great Vibes','Snell Roundhand',cursive;font-weight:400}
.mincho{font-family:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif}
body{background:var(--cream)}
.shell{max-width:720px;margin:0 auto;padding:16px 14px 70px;position:relative;z-index:1}
.minihead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 4px 12px;font-size:12px;color:var(--teal-deep);font-weight:700;letter-spacing:.06em}
html.embed .minihead,html.embed .proto{display:none}
html.embed .shell{padding-top:10px}
.quiz-card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:28px 22px;min-height:340px}
.quiz-card.stage{background:transparent;border:0;box-shadow:none;padding:0;min-height:0}
/* ふわっと舞う花びら（診断結果の画面全体） */
.petals{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.petals i{position:absolute;top:-30px;width:13px;height:17px;border-radius:70% 0 70% 0;background:rgba(255,140,185,.5);animation:fall linear infinite}
.petals i:nth-child(2n){background:rgba(232,196,138,.55);width:11px;height:14px}
.petals i:nth-child(3n){background:rgba(255,190,214,.6)}
@keyframes fall{0%{transform:translate3d(0,-30px,0) rotate(0)}50%{transform:translate3d(28px,55vh,0) rotate(180deg)}100%{transform:translate3d(-20px,112vh,0) rotate(360deg)}}
/* 封筒の画面 */
.scene{position:relative;border-radius:24px;padding:34px 20px 30px;text-align:center;background:linear-gradient(180deg,#FFF3F8 0%,#FFEAF2 52%,#FFF9F1 100%);border:1px solid #F5D9E6;box-shadow:0 18px 50px rgba(194,24,91,.10);transition:opacity .8s ease,transform .8s ease}
.scene.leaving{opacity:0;transform:translateY(-14px) scale(.98)}
.scene .eyebrow{color:var(--gold);letter-spacing:.3em;margin:0 0 6px}
.scene .big{font-size:26px;line-height:1.5;color:var(--ink);margin:0 0 8px}
.scene .sub{color:var(--muted);margin:0 0 4px}
.envwrap{animation:arrive 1.7s cubic-bezier(.2,.7,.2,1) both;margin:22px auto 8px;width:268px}
@keyframes arrive{from{opacity:0;transform:translateY(60px) scale(.88);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
.envx{position:relative;width:268px;height:176px;perspective:800px;filter:drop-shadow(0 16px 22px rgba(194,24,91,.22));animation:floaty 4.2s 1.7s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-12px) rotate(1.5deg)}}
.envx .ebody{position:absolute;inset:0;border-radius:10px;background:linear-gradient(160deg,#FFF6E8,#F6DEBE)}
.envx .paper{position:absolute;left:18px;right:18px;top:14px;bottom:14px;border-radius:5px;background:#fffdf8;padding:18px 20px;transition:transform 1.1s .5s cubic-bezier(.2,.7,.2,1)}
.envx .paper i{display:block;height:3px;border-radius:2px;background:#f2d9e3;margin:0 0 10px}
.envx .front{position:absolute;inset:0;border-radius:10px;background:linear-gradient(150deg,#FFF2DE,#F1D5AE);clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%)}
.envx .flap{position:absolute;left:0;right:0;top:0;height:100px;border-radius:10px 10px 0 0;background:linear-gradient(#FFF9EE,#F4DBB6);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;transition:transform 1s ease;z-index:3}
.envx .seal{position:absolute;left:50%;top:72px;width:38px;height:38px;margin-left:-19px;border-radius:50%;z-index:4;text-align:center;line-height:38px;color:#fff;font-size:18px;background:radial-gradient(circle at 35% 30%,#ff9fbd,#b02b5c);box-shadow:0 2px 8px rgba(120,20,60,.45),0 0 16px rgba(255,150,190,.6);transition:opacity .4s,transform .4s}
.envx.open{animation:none}
.envx.open .flap{transform:rotateX(180deg);z-index:0}
.envx.open .seal{opacity:0;transform:scale(1.6)}
.envx.open .paper{transform:translateY(-96px)}
.scene .form{background:rgba(255,255,255,.85);border:1px solid #F5D9E6;margin-top:22px;text-align:left;animation:fadeup 1.2s 1.4s both}
.scene .lead2{animation:fadeup 1.2s .9s both;margin:0}
@keyframes fadeup{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
/* 診断結果のお手紙 */
.letter{position:relative;overflow:hidden;font-family:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;background:#FFFDF8;border:1px solid #EBD9BE;border-radius:20px;padding:0 0 26px;margin-top:14px;box-shadow:0 20px 56px rgba(140,40,80,.16);animation:rise 1.7s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(90px) scale(.93);filter:blur(10px)}55%{filter:blur(0)}to{opacity:1;transform:none;filter:blur(0)}}
.letter::before{content:"";display:block;height:6px;background:linear-gradient(90deg,#ffb3d1,#e8c48a,#ffb3d1)}
.letter>*:not(.arch){margin-left:22px;margin-right:22px}
.arch{margin:0;padding:30px 16px 22px;text-align:center;background:linear-gradient(180deg,#FFF1F7,#FFFDF8);border-bottom:1px solid #F0DFC8}
.arch .orn{color:var(--gold);letter-spacing:.6em;margin:0 0 4px;font-size:14px}
.arch .script{font-size:46px;color:var(--rose);margin:0;line-height:1.2}
.arch .to{font-size:24px;letter-spacing:.18em;margin:6px 0 4px}
.arch .date{font-size:12px;letter-spacing:.18em;color:var(--muted);margin:0}
.letter p,.letter li{line-height:2.05}
.letter .lt-open{margin-top:22px}
.letter .eyebrow{color:var(--gold);text-align:center;letter-spacing:.3em;margin-top:26px}
.letter .result-name{color:var(--rose);text-align:center;font-size:26px}
.letter .type-lead{text-align:center;font-weight:700}
.letter .rh{border:0;padding:0;margin-top:46px;margin-bottom:14px;text-align:center;color:var(--rose);font-size:20px}
.letter .rh::before{content:"✿";display:block;color:var(--gold);font-size:15px;margin-bottom:6px}
.letter .rh::after{content:"";display:block;width:70px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:10px auto 0}
.letter .scenes li,.letter .gets li,.letter .steps3 li{background:#FFF5F9;border:1px solid #F5D9E6}
.letter .steps3 li::before{background:var(--rose)}
.letter details{border-bottom:1px solid #EBD9BE}
.letter details summary{color:var(--rose)}
.letter .lt-from{border-top:1px dashed #D9C3A0}
.letter .lt-from img{border:2px solid #E8C48A}
/* ふわっと現れる（スクロールに合わせて） */
.reveal{opacity:0;transform:translateY(28px);filter:blur(5px);transition:opacity 1.2s ease,transform 1.2s cubic-bezier(.2,.7,.2,1),filter 1.2s ease}
.reveal.in{opacity:1;transform:none;filter:none}
/* 先輩の声 */
.vcards{display:grid;gap:16px;margin:6px 0 0}
.vcard{margin:0;background:#fff;border:1px solid #F0DFC8;border-radius:18px;overflow:hidden;box-shadow:0 10px 26px rgba(140,40,80,.10)}
.vplay{position:relative;display:block;width:100%;aspect-ratio:16/9;padding:0;border:0;background:#222;cursor:pointer}
.vplay img{width:100%;height:100%;object-fit:cover;display:block}
.vplay iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.pbtn{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(194,24,91,.92);box-shadow:0 6px 18px rgba(0,0,0,.3)}
.pbtn::after{content:"";position:absolute;left:25px;top:19px;border-left:21px solid #fff;border-top:13px solid transparent;border-bottom:13px solid transparent}
.vcard figcaption{padding:12px 16px 14px;font-family:var(--gothic)}
.vcard figcaption b{display:block;font-size:16px}
.vcard .vm{display:inline-block;font-size:12px;color:var(--rose);background:var(--rose-soft);border-radius:99px;padding:1px 10px;margin:4px 0}
.vcard .vl{display:block;font-size:14px;line-height:1.7;color:var(--ink)}
.qcards{display:grid;gap:12px}
.qcard{margin:0;background:#FFF5F9;border:1px solid #F5D9E6;border-radius:16px;padding:16px 18px 14px 50px;position:relative;font-family:var(--gothic)}

  document.getElementById('petals').hidden = false;
  card.innerHTML = `<div class="scene" id="scene">
    <p class="eyebrow">YOUR RESULT</p>
    <p class="big mincho">診断結果が出ました</p>

    <div class="envwrap"><div class="envx" id="envx" aria-hidden="true"><div class="ebody"></div><div class="paper"><i></i><i></i><i></i></div><div class="front"></div><div class="flap"></div><div class="seal">&#9825;</div></div></div>
    <div class="form" id="formSlot">
      <!-- 【組み込み】ここから：本番では、この div の中身をUTAGEの登録フォームの埋め込みに差し替える -->
      <label for="nm">お名前（ニックネームでも大丈夫です）</label>

      <!-- 【組み込み】ここまで -->

    </div>
    <button class="back" id="again">最初からやり直す</button></div>`;
  document.getElementById('go').onclick = () => {
    const n = document.getElementById('nm'); const m = document.getElementById('mail');
    const nm = n ? n.value.trim().slice(0, 20) : ''; const ml = m ? m.value.trim() : '';
    let err = document.getElementById('formErr');
    if (!err) { err = document.createElement('p'); err.id = 'formErr'; err.className = 'note'; err.style.cssText = 'color:#C2185B;font-weight:700;margin:0 0 10px'; document.getElementById('go').before(err); }
    if (!nm) { err.textContent = 'お名前（ニックネームでも大丈夫です）を入れてください。'; n.focus(); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(ml)) { err.textContent = 'メールアドレスの形を確かめてください。例：example@gmail.com'; m.focus(); return; }
    err.textContent = '';
    NAME = nm;
    document.getElementById('go').disabled = true;
    document.getElementById('envx').classList.add('open');
    setTimeout(() => document.getElementById('scene').classList.add('leaving'), 1500);
    setTimeout(() => thanks(t), 2300);
  };
  document.getElementById('again').onclick = () => { resultView(false); card.classList.remove('stage'); document.getElementById('petals').hidden = true; step = 0; ans.length = 0; render(); };
  if (window.parent !== window) { try { window.scrollTo(0, 0); } catch (e) {} }
}

function start(){ render(); }
(function(){
  const pet = document.getElementById('petals');
  pet.innerHTML = Array.from({length: 12}, (_, k) => '<i style="left:' + (k * 8.3 + 2) + '%;animation-duration:' + (11 + (k * 7) % 9) + 's;animation-delay:-' + ((k * 5) % 13) + 's"></i>').join('');
})();
const VIEW = new URLSearchParams(location.search).get('view');
if (VIEW === 'result') {
  let t = AD && TYPES[AD] ? AD : null;
  try { t = t || localStorage.getItem('yabata_diag_type'); } catch (e) {}
  if (t && TYPES[t]) { ans.length = 0; sampleAns(t).forEach(x => ans.push(x)); thanks(t); } else start();
} else start();
